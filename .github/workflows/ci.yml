name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: xcodebuild -project Outputs.xcodeproj -scheme Outputs -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: xcodebuild -project Outputs.xcodeproj -scheme Outputs -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
