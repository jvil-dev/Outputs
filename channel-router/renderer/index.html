<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self' file: blob:; script-src 'self'; connect-src 'self' file:">
  <title>Channel Router</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="noise-overlay"></div>
  <div id="app">
    <header>
      <h1>Channel Router</h1>
    </header>

    <section id="video-container" class="hidden">
      <video id="video-player" muted playsinline></video>
    </section>

    <section id="transport">
      <div id="transport-controls">
        <button id="btn-prev" title="Previous track">&#9198;</button>
        <button id="btn-restart" title="Restart">|&laquo;</button>
        <button id="btn-play" class="btn-play" title="Play/Pause">&#9654;</button>
        <button id="btn-end" title="Go to end">&raquo;|</button>
        <button id="btn-next" title="Next track">&#9197;</button>
      </div>
      <div id="seek-row">
        <input type="range" id="seek-bar" min="0" max="1000" value="0" step="1">
        <span id="time-display">0:00 / 0:00</span>
      </div>
    </section>

    <section id="outputs">
      <div class="output-group">
        <div class="output-row">
          <label for="output-a">Output A:</label>
          <select id="output-a"><option value="">— select device —</option></select>
        </div>
        <div class="delay-row">
          <label>Delay:</label>
          <input type="range" id="delay-a" min="0" max="500" value="0" step="5">
          <span id="delay-a-value">0 ms</span>
        </div>
      </div>
      <div class="output-group">
        <div class="output-row">
          <label for="output-b">Output B:</label>
          <select id="output-b"><option value="">— select device —</option></select>
        </div>
        <div class="delay-row">
          <label>Delay:</label>
          <input type="range" id="delay-b" min="0" max="500" value="0" step="5">
          <span id="delay-b-value">0 ms</span>
        </div>
      </div>
    </section>

    <section id="channel-list">
      <!-- Dynamically populated -->
    </section>

    <section id="playlist">
      <div id="playlist-header">
        <span>Playlist</span>
        <button id="btn-clear-playlist" title="Clear playlist">&times;</button>
      </div>
      <div id="playlist-items">
        <!-- Dynamically populated -->
      </div>
    </section>

    <section id="drop-zone" tabindex="0">
      <p>Drop files here or click to browse</p>
    </section>

    <div id="status-bar"></div>
  </div>

  <script src="device-manager.js"></script>
  <script src="audio-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
